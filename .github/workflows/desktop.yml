name: Desktop installers

# Builds the OnStage Worship desktop app for Windows, macOS (Apple Silicon and
# Intel) and Linux, runs the packaged app's self-test on each system (offline
# speech engine + verse detection + projector window) and uploads the
# installers. Pushing a tag such as v1.0.0 also publishes a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, master, 'claude/**']
    paths: ['desktop/**', 'worship/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
          - name: mac-apple-silicon
            os: macos-latest
            script: dist:mac
          - name: mac-intel
            os: macos-15-intel
            script: dist:mac
          - name: linux
            os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: '"dist/win-unpacked/OnStage Worship.exe" --selftest'

      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(ls -d dist/mac*/"OnStage Worship.app" | head -n 1)
          "$APP/Contents/MacOS/OnStage Worship" --selftest

      - name: Self-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/linux-unpacked/onstage-worship --no-sandbox --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: OnStage-Worship-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
